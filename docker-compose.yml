version: "3.9"

services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: riesgo-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      # Hot-reload en desarrollo: monta el código fuente
      - ./backend/app:/app/app
      # Persistir la BD SQLite fuera del contenedor
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend (Streamlit) — descomenta cuando tengas el frontend listo
